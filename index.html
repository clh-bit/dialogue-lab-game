<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校園情境練習｜選擇情境</title><link rel="stylesheet" href="style.css?v=paper-texture-2"><style>[hidden]{display:none!important}main{max-width:1000px;margin:auto;padding:20px}.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.menu-card{padding:20px;border:1px solid #b9ccd5;border-radius:14px;background:white;color:#173044}button{cursor:pointer;font:inherit;padding:10px 16px;margin:5px;border-radius:8px}button:focus-visible{outline:3px solid #e49d22;outline-offset:3px}#screen img,dialog img{max-width:100%;height:auto}dialog{max-width:95vw;max-height:95vh}dialog img{max-height:80vh;object-fit:contain}.build-label{color:#526574;font-size:.85rem}
/* Warm woven-paper texture: backgrounds only, never an image overlay. */
body::before{background-image:radial-gradient(ellipse at center,rgba(124,91,55,.17) .65px,transparent 1px),repeating-linear-gradient(0deg,rgba(130,99,62,.055) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(130,99,62,.045) 0 1px,transparent 1px 5px);background-size:7px 9px,100% 4px,5px 100%}
main{background-color:#fff8ed;background-image:var(--paper-grain),radial-gradient(ellipse at center,rgba(128,91,54,.14) .6px,transparent 1px),repeating-linear-gradient(0deg,rgba(130,99,62,.045) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(130,99,62,.035) 0 1px,transparent 1px 5px);background-size:180px 180px,7px 9px,100% 4px,5px 100%;background-repeat:repeat}
</style><script src="app.js?v=menu-integrated-1" defer></script></head><body><main><h1>校園情境練習</h1><p>練習表達感受、說出界線，並探索不同回應。</p><p class="build-label">漫畫版 · 暖色紙紋更新 2</p><button id="sound" type="button" aria-pressed="true">點擊音效：開</button><label><input type="checkbox" id="motion"> 減少動態效果</label><section id="scenarioMenu" aria-labelledby="menuTitle"><h2 id="menuTitle">選擇你想練習的情境</h2><p>選擇一個情境開始，不需要依照次序。</p><div class="menu-grid"><article class="menu-card"><h3>朋友沒有等我</h3><p>表達失望，並提出具體希望。</p><button type="button" data-scenario="0">開始：朋友沒有等我</button></article><article class="menu-card"><h3>我的界線，我來說</h3><p>練習說出自己的界線。</p><button type="button" data-scenario="1">開始：我的界線，我來說</button></article><article class="menu-card"><h3>功課卡關了</h3><p>表達困難，尋求具體協助。</p><button type="button" data-scenario="2">開始：功課卡關了</button></article></div></section><section id="gameArea" hidden><label for="progress">練習進度</label><progress id="progress" max="18" value="0"></progress><p id="status" role="status" aria-live="polite"></p><div id="screen" tabindex="-1"></div><nav aria-label="遊戲操作"><button type="button" id="back">上一步</button><button type="button" id="next">繼續</button><button type="button" id="returnMenu">選擇其他情境</button></nav></section><button type="button" id="reset">清除進度並重新開始</button><p id="setupStatus" role="status">正在載入遊戲……</p><noscript>請啟用 JavaScript 才能選擇情境。</noscript><dialog id="zoom"><button id="close" type="button">關閉</button><img alt="放大的情境漫畫"></dialog></main><script>
document.addEventListener('DOMContentLoaded',()=>{
 const get=id=>document.getElementById(id);
 if(typeof state==='undefined'||typeof render!=='function'){get('setupStatus').textContent='遊戲程式未能載入，請重新整理或檢查 app.js。';return;}
 function showMenu(){version++;pending=null;get('gameArea').hidden=true;get('scenarioMenu').hidden=false;get('scenarioMenu').querySelector('button').focus();}
 document.querySelectorAll('[data-scenario]').forEach(b=>b.addEventListener('click',()=>{version++;pending=null;state.i=Number(b.dataset.scenario);state.step=0;save();get('scenarioMenu').hidden=true;get('gameArea').hidden=false;get('back').hidden=false;render();}));
 get('returnMenu').addEventListener('click',showMenu);
 get('reset').addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();if(confirm('清除所有進度並返回情境選單？')){state=fresh();save();showMenu();}},true);
 let sound=true,audio;try{sound=localStorage.getItem('dialogue-click-sound')!=='off';}catch(e){}
 function update(){get('sound').textContent=sound?'點擊音效：開':'點擊音效：關';get('sound').setAttribute('aria-pressed',String(sound));}
 function beep(){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();const play=()=>{const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(440,t+.05);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.07);o.onended=()=>{o.disconnect();g.disconnect();};};if(audio.state==='suspended')audio.resume().then(play).catch(()=>{});else if(audio.state==='running')play();}catch(e){}}
 document.addEventListener('click',e=>{if(!(e.target instanceof Element))return;const b=e.target.closest('button');if(b&&!b.disabled&&b.id!=='sound')beep();},true);
 get('sound').addEventListener('click',()=>{sound=!sound;try{localStorage.setItem('dialogue-click-sound',sound?'on':'off');}catch(e){}update();if(sound)beep();});
 update();get('setupStatus').textContent='請選擇一個情境開始。';showMenu();
});
</script></body></html>
