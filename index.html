<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校園情境練習</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; color: #172033; font-family: system-ui, sans-serif; line-height: 1.7; }
    main { max-width: 1000px; margin: auto; padding: 24px 16px; }
    header { margin-bottom: 20px; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin-bottom: 8px; }
    #screen { background: white; border-radius: 16px; padding: clamp(16px, 4vw, 32px); min-height: 280px; box-shadow: 0 4px 20px #1720330a; }
    #screen img { max-width: 100%; height: auto; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; background: #155e75; color: white; border: 0; border-radius: 8px; padding: 10px 16px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .navigation { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    #reset { background: #475569; }
    progress { width: 100%; height: 14px; accent-color: #155e75; }
    #status { min-height: 1.7em; color: #475569; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; }
    .card { padding: 18px; border: 1px solid #cbd5e1; border-radius: 12px; }
    textarea { width: 100%; min-height: 100px; }
    .setup-note { padding: 12px; border-left: 4px solid #d97706; background: #fffbeb; }
  </style>
  <!-- Keep these classic scripts in this order. Both files must be beside this HTML. -->
  <script src="app.js" defer></script>
  <script src="scenario-menu.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>校園情境練習</h1>
      <p>練習表達感受、說出界線，並探索不同的回應。</p>
      <label for="progress">練習進度</label>
      <progress id="progress" value="0" max="100"></progress>
      <p id="status" role="status" aria-live="polite">正在載入情境……</p>
    </header>
    <section id="screen" tabindex="-1" aria-label="情境練習內容">
      <p class="setup-note">這個頁面需要配合原有的 app.js 和 scenario-menu.js。請將兩個檔案放在與此 HTML 相同的資料夾。</p>
    </section>
    <nav class="navigation" aria-label="情境操作">
      <button id="back" type="button" hidden>上一步</button>
      <button id="next" type="button" hidden>下一步</button>
      <button id="reset" type="button">重新開始</button>
    </nav>
    <noscript><p>請啟用 JavaScript 才能使用情境練習。</p></noscript>
  </main>
</body>
</html>
