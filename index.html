<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校園情境練習｜四個情境</title><link rel="stylesheet" href="style.css?v=watercolor-3"><style>[hidden]{display:none!important}main{max-width:1000px;margin:auto;padding:20px}.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.menu-card{padding:20px;border:1px solid #b9ccd5;border-radius:14px;background:white;color:#173044}button{cursor:pointer;font:inherit;padding:10px 16px;margin:5px;border-radius:8px}button:focus-visible{outline:3px solid #e49d22;outline-offset:3px}#screen img,dialog img{max-width:100%;height:auto}dialog{max-width:95vw;max-height:95vh}dialog img{max-height:80vh;object-fit:contain}.build-label{color:#526574;font-size:.85rem}:root{--paper-grain:none}body{background-color:#f8eddf}body::before{background-image:radial-gradient(ellipse at 8% 14%,rgba(219,156,128,.42) 0%,rgba(230,179,151,.23) 22%,transparent 48%),radial-gradient(ellipse at 93% 28%,rgba(173,192,148,.38) 0%,rgba(188,205,167,.18) 26%,transparent 52%),radial-gradient(ellipse at 24% 92%,rgba(230,194,112,.32) 0%,transparent 48%);background-size:100% 100%;background-repeat:no-repeat}main{background-color:#fffaf2;background-image:radial-gradient(ellipse at 0% 0%,rgba(236,185,156,.32) 0%,transparent 43%),radial-gradient(ellipse at 100% 30%,rgba(189,206,169,.24) 0%,transparent 40%),radial-gradient(ellipse at 65% 100%,rgba(237,209,148,.26) 0%,transparent 44%);background-size:100% 100%;background-repeat:no-repeat}</style><script src="app.js?v=four-menu-repair-2" defer></script></head><body><main><h1>校園情境練習</h1><p>練習表達感受、說出界線，並探索不同回應。</p><p class="build-label">漫畫版 · 四個情境修正版 2 · 暖色水彩</p><button id="sound" type="button" aria-pressed="true">點擊音效：開</button><label><input type="checkbox" id="motion"> 減少動態效果</label><section id="scenarioMenu" aria-labelledby="menuTitle"><h2 id="menuTitle">選擇你想練習的情境</h2><p>選擇一個情境開始，不需要依照次序。</p><div class="menu-grid"><article class="menu-card"><h3>朋友沒有等我</h3><p>表達失望，並提出具體希望。</p><button type="button" data-scenario="0">開始：朋友沒有等我</button></article><article class="menu-card"><h3>我的界線，我來說</h3><p>練習說出自己的界線。</p><button type="button" data-scenario="1">開始：我的界線，我來說</button></article><article class="menu-card"><h3>功課卡關了</h3><p>表達困難，尋求具體協助。</p><button type="button" data-scenario="2">開始：功課卡關了</button></article><article class="menu-card"><h3>朋友洩露秘密</h3><p>表達受傷，保護私事，並說出界線。</p><button type="button" data-scenario="3">開始：朋友洩露秘密</button></article></div></section><section id="gameArea" hidden><label for="progress">練習進度</label><progress id="progress" max="24" value="0"></progress><p id="status" role="status" aria-live="polite"></p><div id="screen" tabindex="-1"></div><nav aria-label="遊戲操作"><button type="button" id="back">上一步</button><button type="button" id="next">繼續</button><button type="button" id="returnMenu">選擇其他情境</button></nav></section><button type="button" id="reset">清除進度並重新開始</button><p id="setupStatus" role="status">正在載入遊戲……</p><noscript>請啟用 JavaScript 才能開始情境練習。</noscript><dialog id="zoom"><button id="close" type="button">關閉</button><img alt="放大的情境漫畫"></dialog></main><script>
document.addEventListener('DOMContentLoaded',()=>{
 const get=id=>document.getElementById(id);
 function report(message){get('setupStatus').textContent=message;}
 if(typeof state==='undefined'||typeof render!=='function'||typeof scenes==='undefined'){report('遊戲程式未能載入，請重新整理或檢查 app.js。');document.querySelectorAll('[data-scenario]').forEach(b=>b.disabled=true);return;}
 try{
 const EXTRA_KEY='story-lab-four-scenarios-v1';
 if(!scenes.some(s=>s.file==='friend-secret'))scenes.push({title:'朋友洩露秘密',file:'friend-secret',intro:'你以為是朋友之間的私事，卻發現其他同學也知道了。你可以表達受傷，並說出自己的界線。',labels:['A｜公開指責','B｜忍住不說','C｜私下設立界線'],words:['你怎可以把我的秘密告訴所有人！','先不說出來，把難過留在心裡。','你把我的秘密告訴別人，我感到不被尊重。請不要再分享我的私事。'],feedback:[['信任被打破，感到生氣或受傷是可以理解的。','你有權要求對方停止轉述，不需要先隱藏自己的感受。','如果情況容許，可以找較安靜的地方說清楚界線，避免在公開爭吵中讓更多人知道私事。'],['一時說不出口，不代表你接受了這件事，也不是你的錯。','你可以先整理心情，等準備好再談，或請信任的人陪你表達。','可以說：我現在還很難過，想先靜一靜。請不要再分享我的私事。'],['你說出了事情帶來的影響，也清楚要求停止分享。','對方道歉後，你仍然可以需要時間，不必立即原諒或恢復原來的信任。','若私事繼續被轉述，可以找信任的老師、家人或支援者協助。']],parts:[['當你把我的私事告訴別人時','你從來都不值得信任'],['我感到受傷和失望','你就是一個壞朋友'],['請不要再分享我的私事。','我想先靜一靜，等準備好再談。']]});
 function normalize(){for(const k of ['feelings','answers','builds']){if(!Array.isArray(state[k]))state[k]=[];while(state[k].length<scenes.length)state[k].push(null);state[k]=state[k].slice(0,scenes.length);}}
 try{const old=JSON.parse(localStorage.getItem(EXTRA_KEY));if(old&&Number.isInteger(old.i)&&old.i>=0&&old.i<scenes.length&&Number.isInteger(old.step)&&old.step>=0&&old.step<6&&['feelings','answers','builds'].every(k=>Array.isArray(old[k])&&old[k].length===scenes.length)&&old.answers.every(n=>n===null||(Number.isInteger(n)&&n>=0&&n<3))){state=old;if(state.step===4&&state.answers[state.i]===null)state.step=3;}}catch(e){}
 normalize();
 const originalSave=save;save=function(){normalize();originalSave();try{localStorage.setItem(EXTRA_KEY,JSON.stringify(state));}catch(e){}};
 const originalRender=render;render=async function(){normalize();const expected=version+1;get('progress').max=scenes.length*6;await originalRender();if(version!==expected)return;const marker=get('screen').querySelector('small');if(marker)marker.textContent=`情境 ${state.i+1} / ${scenes.length} · 階段 ${state.step+1} / 6`;if(state.step===5)get('next').textContent=state.i===scenes.length-1?'完成練習':'下一個情境';};
 function showMenu(){version++;pending=null;get('gameArea').hidden=true;get('scenarioMenu').hidden=false;report('四個情境已載入，請選擇一個開始。');get('scenarioMenu').querySelector('button').focus();}
 document.querySelectorAll('[data-scenario]').forEach(b=>b.addEventListener('click',()=>{version++;pending=null;state.i=Number(b.dataset.scenario);state.step=0;save();get('scenarioMenu').hidden=true;get('gameArea').hidden=false;get('back').hidden=false;report('');render();}));
 get('next').addEventListener('click',e=>{if(state.step!==5)return;e.preventDefault();e.stopImmediatePropagation();if(state.i<scenes.length-1){state.i++;state.step=0;render();}else{save();version++;pending=null;get('screen').replaceChildren(el('h2','這次練習完成！'),el('p','你的感受和界線值得被聽見，不需要一次說得完美。你可以返回選單，繼續探索其他情境。'),btn('返回情境選單',showMenu));get('next').hidden=true;get('back').disabled=true;get('progress').value=scenes.length*6;get('status').textContent='這次練習完成。';get('screen').focus({preventScroll:true});}},true);
 get('returnMenu').addEventListener('click',showMenu);get('reset').addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();if(confirm('清除所有進度並返回情境選單？')){state=fresh();save();showMenu();}},true);
 let sound=true,audio;try{sound=localStorage.getItem('dialogue-click-sound')!=='off';}catch(e){}
 function update(){get('sound').textContent=sound?'點擊音效：開':'點擊音效：關';get('sound').setAttribute('aria-pressed',String(sound));}
 function beep(){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();const play=()=>{const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(440,t+.05);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.07);o.onended=()=>{o.disconnect();g.disconnect();};};if(audio.state==='suspended')audio.resume().then(play).catch(()=>{});else if(audio.state==='running')play();}catch(e){}}
 document.addEventListener('click',e=>{if(!(e.target instanceof Element))return;const b=e.target.closest('button');if(b&&!b.disabled&&b.id!=='sound')beep();},true);get('sound').addEventListener('click',()=>{sound=!sound;try{localStorage.setItem('dialogue-click-sound',sound?'on':'off');}catch(e){}update();if(sound)beep();});
 save();update();showMenu();
 }catch(error){report('情境初始化失敗：'+error.message);console.error(error);}
});
</script></body></html>
