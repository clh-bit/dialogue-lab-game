<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校園情境練習 — 選擇情境</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4f7;color:#193343;font:17px/1.7 system-ui,sans-serif}main{max-width:950px;margin:auto;padding:24px 16px}section{background:white;padding:26px;border-radius:16px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}article{border:1px solid #ccdce4;padding:20px;border-radius:12px}button{font:inherit;background:#16667b;color:white;border:0;border-radius:8px;padding:12px 17px;margin:5px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,textarea:focus-visible{outline:3px solid #e4a220;outline-offset:3px}[hidden]{display:none!important}.story{padding:20px;background:#edf6f8;border-radius:10px;font-size:1.15rem}label{display:block;margin:10px 0}textarea{width:100%;min-height:130px;font:inherit;padding:12px}#feedback{padding:16px;background:#edf8f1}progress{width:100%;accent-color:#16667b}</style></head><body><main><h1>校園情境練習</h1><p>練習表達感受、說出界線，並探索不同回應。</p><button id="sound" type="button" aria-pressed="true">點擊音效：開</button>
<section id="menu"><h2>選擇你想練習的情境</h2><p>點選下方其中一個情境開始。</p><div class="grid"><article><h3>朋友沒有等我</h3><p>練習表達失望和提出希望。</p><button type="button" data-start="0">開始：朋友沒有等我</button></article><article><h3>我的界線，我來說</h3><p>練習說出身體界線。</p><button type="button" data-start="1">開始：我的界線，我來說</button></article><article><h3>功課卡關了</h3><p>練習表達困難和尋求協助。</p><button type="button" data-start="2">開始：功課卡關了</button></article></div></section>
<section id="game" hidden><h2 id="title"></h2><progress id="progress" max="6" value="0" aria-label="練習進度"></progress><p id="status" role="status"></p><div id="content" tabindex="-1"></div><nav><button id="back" type="button">上一步</button><button id="next" type="button">下一步</button><button id="return" type="button">選擇其他情境</button></nav></section><button id="reset" type="button">清除練習紀錄</button><p>單檔版 · 起始畫面為情境選單 · 不需要其他 JS 檔案</p><noscript>選單已顯示；請啟用 JavaScript 才能開始練習。</noscript></main><script>
const scenes=[{"title": "朋友沒有等我", "story": ["你和朋友約好放學一起離開。", "你到達約定地點，發現朋友已經走了，沒有留下訊息。", "你找一個安靜的時候說：「昨天找不到你，我有點失望。」", "你可以問問發生了甚麼，再提出希望：「下次先走，可以先告訴我嗎？」"], "choices": ["直接說：你根本不在乎我！", "裝作沒事，不再提起。", "說明自己的失望，並請朋友下次先通知。"], "feedback": ["你想讓朋友知道這件事很重要。可以描述發生的事，避免直接判定對方的想法。", "你可以先讓自己平靜下來。準備好後，也可以說出希望。", "你表達了感受和具體希望，也可以留空間聽聽朋友的解釋。"], "starter": "昨天你先走了，我覺得＿＿。下次可以＿＿嗎？"}, {"title": "我的界線，我來說", "story": ["同學不停拍你的肩膀，想引你注意。", "你不喜歡這種接觸，往後退了一步。", "你可以說：「我不喜歡這樣被碰，請停下來。」", "如果對方沒有停止，你可以離開，找信任的老師或成年人協助。"], "choices": ["忍著不說，希望對方自己停下。", "退開並說：我不喜歡，請停下來。", "生氣地推回去。"], "feedback": ["你可能需要時間才說得出口。你的不舒服值得被重視，也可以先離開或找人協助。", "你清楚表達了界線。如果對方繼續，可以離開並尋求協助。", "你想保護自己。情況容許時，可以先拉開距離、要求停止並尋求協助。"], "starter": "當你＿＿，我不舒服。請你＿＿。如果沒有停止，我會＿＿。"}, {"title": "功課卡關了", "story": ["你遇到一道不明白的題目。", "有人催你快一點，你越來越心急。", "你可以說：「我卡在這一題，不是故意拖延。」", "你提出具體請求：「可以陪我讀一次題目，讓我再試嗎？」"], "choices": ["說：我不明白題目，可以陪我讀一次嗎？", "說：我就是不會！把功課推開。", "直接抄答案。"], "feedback": ["你指出了困難並提出具體請求。得到提示後，可以自己試一步。", "你表達了挫敗。平靜後可以補充自己卡在哪一步。", "你可能想減輕壓力。可以改為請對方解釋第一步，幫助自己理解。"], "starter": "我卡在＿＿，覺得＿＿。你可以幫我＿＿嗎？"}];
const $=id=>document.getElementById(id);let current=0,step=0,records={},audio,sound=true;
try{records=JSON.parse(localStorage.getItem('scenario-single-v2')||'{}');if(!records||typeof records!=='object'||Array.isArray(records))records={};sound=localStorage.getItem('scenario-sound-v2')!=='off';}catch(e){}
function save(){try{localStorage.setItem('scenario-single-v2',JSON.stringify(records));}catch(e){}}
function record(){return records[current]||(records[current]={feelings:[],choice:null,draft:''});}
function el(tag,text){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
function menu(){$('game').hidden=true;$('menu').hidden=false;$('menu').querySelector('button').focus();}
function render(){const s=scenes[current],r=record(),box=$('content');box.replaceChildren();$('title').textContent=s.title;$('status').textContent=`第 ${step+1} / 7 步`;$('progress').value=step;$('back').disabled=step===0;$('next').disabled=step===5&&r.choice===null;$('next').textContent=step===6?'完成並返回選單':'下一步';
if(step<4){const p=el('p',s.story[step]);p.className='story';box.append(el('h3',`故事 ${step+1} / 4`),p);}
else if(step===4){box.append(el('h3','我可能有甚麼感受？'),el('p','可以選多項，也可以暫時不選。'));['失望','生氣','緊張','不舒服','難過','無助'].forEach(f=>{let label=el('label'),input=el('input');input.type='checkbox';input.checked=r.feelings.includes(f);input.addEventListener('change',()=>{r.feelings=input.checked?[...new Set([...r.feelings,f])]:r.feelings.filter(x=>x!==f);save();});label.append(input,document.createTextNode(' '+f));box.append(label);});}
else if(step===5){box.append(el('h3','你會怎樣回應？'));s.choices.forEach((t,i)=>{let b=el('button',`${'ABC'[i]}｜${t}`);b.type='button';b.setAttribute('aria-pressed',String(r.choice===i));b.addEventListener('click',()=>{r.choice=i;save();render();});box.append(b);});if(r.choice!==null){let feedback=el('p',s.feedback[r.choice]);feedback.id='feedback';box.append(el('h3','鼓勵與提示'),feedback);}}
else{box.append(el('h3','組合自己的回應'),el('p',s.starter));let label=el('label','我的回應');label.htmlFor='draft';let text=el('textarea');text.id='draft';text.value=r.draft;text.addEventListener('input',()=>{r.draft=text.value;save();});box.append(label,text,el('p','請勿填寫真實姓名或私人秘密。內容會嘗試儲存在這個瀏覽器。'));}box.focus();}
document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>{current=Number(b.dataset.start);step=0;record();$('menu').hidden=true;$('game').hidden=false;render();}));
$('next').addEventListener('click',()=>{if(step===5&&record().choice===null)return;if(step===6){record().complete=true;save();menu();}else{step++;render();}});$('back').addEventListener('click',()=>{if(step>0){step--;render();}});$('return').addEventListener('click',menu);$('reset').addEventListener('click',()=>{if(confirm('清除所有練習紀錄？')){records={};save();menu();}});
function updateSound(){$('sound').textContent=sound?'點擊音效：開':'點擊音效：關';$('sound').setAttribute('aria-pressed',String(sound));}
function beep(){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();const play=()=>{const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(440,t+.05);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.07);o.onended=()=>{o.disconnect();g.disconnect();};};if(audio.state==='suspended')audio.resume().then(play).catch(()=>{});else if(audio.state==='running')play();}catch(e){}}
document.addEventListener('click',e=>{if(!(e.target instanceof Element))return;let b=e.target.closest('button');if(b&&!b.disabled&&b.id!=='sound')beep();},true);$('sound').addEventListener('click',()=>{sound=!sound;try{localStorage.setItem('scenario-sound-v2',sound?'on':'off');}catch(e){}updateSound();if(sound)beep();});updateSound();
</script></body></html>
